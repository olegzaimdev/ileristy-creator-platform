info:
  name: Create Contact
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/contacts"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "Jane",
        "lastName": "Doe",
        "email": "{{contactEmail}}",
        "phoneNumber": "+10000000000",
        "origin": "INSTAGRAM",
        "marketingConsent": true
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Unique email per run so the endpoint doesn't answer 409
        bru.setVar("contactEmail", `jane.doe+${Date.now()}@example.com`);
    - type: tests
      code: |-
        test("returns 201 with Location header", function () {
          expect(res.status).to.equal(201);
          expect(res.headers.location).to.equal(`/api/contacts/${res.body.id}`);
        });

        test("echoes contact fields", function () {
          expect(res.body.id).to.be.a("number");
          expect(res.body.email).to.equal(bru.getVar("contactEmail"));
          expect(res.body.origin).to.equal("INSTAGRAM");
          expect(res.body.marketingConsent).to.equal(true);
          expect(res.body.createdAt).to.be.a("string");
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: contactId
        scope: runtime

settings:
  encodeUrl: true
