info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/actuator/health"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: UP

settings:
  encodeUrl: true
