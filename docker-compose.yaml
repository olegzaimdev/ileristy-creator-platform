services:
  postgres:
    image: postgres:17-alpine
    container_name: ileristy-postgres
    environment:
      POSTGRES_DB: ileristy
      POSTGRES_USER: ileristy
      POSTGRES_PASSWORD: ileristy
    ports:
      - "5432:5432"
    volumes:
      - ileristy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ileristy -d ileristy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ileristy-postgres-data: